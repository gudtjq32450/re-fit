services:
  db:
    image: pgvector/pgvector:pg16
    container_name: refit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-refit}
      POSTGRES_USER: ${POSTGRES_USER:-refit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refit_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: refit-redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
