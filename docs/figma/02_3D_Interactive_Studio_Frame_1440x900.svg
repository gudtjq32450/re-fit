      <text x="111" y="367" text-anchor="middle" fill="#E2E8F0" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="600">데칼 위치 이동</text>

      <line x1="52" y1="404" x2="170" y2="404" stroke="#1E293B"/>
      <text x="56" y="430" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">브러시 반경 (42px)</text>
      <line x1="56" y1="448" x2="166" y2="448" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <circle cx="116" cy="448" r="7" fill="#38BDF8"/>

      <text x="56" y="490" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">구김 강도 (0.78)</text>
      <line x1="56" y1="508" x2="166" y2="508" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <circle cx="138" cy="508" r="7" fill="#38BDF8"/>

      <rect x="52" y="544" width="118" height="34" rx="8" fill="#111827" stroke="#334155"/>
      <text x="111" y="565" text-anchor="middle" fill="#34D399" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="700">원단 마찰음 ON</text>

      <rect x="52" y="696" width="118" height="38" rx="8" fill="#1E293B"/>
      <text x="111" y="719" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="600">주름 전체 초기화</text>
    </g>

    <!-- 4. Bottom 5-Lighting Preset & 360° Environment Rotation Bar -->
    <g id="Bottom_Lighting_Simulation_Bar">
      <rect x="40" y="766" width="844" height="94" rx="12" fill="#090D16" stroke="#1E293B"/>
      <text x="58" y="792" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="700">5대 환경·채광 360° 시뮬레이션 (메타머리즘 검증)</text>
      <text x="580" y="792" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="600">광원 360° 회전 (45°)</text>
      <line x1="704" y1="788" x2="862" y2="788" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <circle cx="748" cy="788" r="7" fill="#FACC15"/>

      <rect x="58" y="808" width="154" height="38" rx="8" fill="#38BDF8"/><text x="135" y="831" text-anchor="middle" fill="#090D16" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="800">스튜디오 (5500K)</text>
      <rect x="222" y="808" width="154" height="38" rx="8" fill="#111827" stroke="#334155"/><text x="299" y="831" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">자연광 (5200K)</text>
      <rect x="386" y="808" width="154" height="38" rx="8" fill="#111827" stroke="#334155"/><text x="463" y="831" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">일반 형광등 (4500K)</text>
      <rect x="550" y="808" width="154" height="38" rx="8" fill="#111827" stroke="#334155"/><text x="627" y="831" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">밤거리 (네온)</text>
      <rect x="714" y="808" width="154" height="38" rx="8" fill="#111827" stroke="#334155"/><text x="791" y="831" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">가로등 (2200K)</text>
