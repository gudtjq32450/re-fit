      <text x="228" y="191" fill="#E2E8F0" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">구기기 브러시 활성 · 소매 부위 주름 변형 &amp; 마찰음 재생 중</text>
    </g>

    <!-- 3. Left Floating Tactile Brush Toolbar -->
    <g id="Left_Tactile_Brush_Toolbar">
