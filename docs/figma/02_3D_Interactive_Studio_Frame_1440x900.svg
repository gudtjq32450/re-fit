      <text x="56" y="184" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="700">촉각 인터랙션 도구</text>

      <rect x="52" y="198" width="118" height="40" rx="8" fill="#38BDF8"/>
      <text x="111" y="223" text-anchor="middle" fill="#090D16" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="800">구기기 (Crumple)</text>

      <rect x="52" y="246" width="118" height="40" rx="8" fill="#111827" stroke="#334155"/>
      <text x="111" y="271" text-anchor="middle" fill="#E2E8F0" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="600">펴기 (Smooth)</text>

      <rect x="52" y="294" width="118" height="40" rx="8" fill="#111827" stroke="#334155"/>
      <text x="111" y="319" text-anchor="middle" fill="#E2E8F0" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="600">옷 회전 (Orbit)</text>

