<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Frame Background -->
  <rect id="Frame_02_3D_Interactive_Studio" width="1440" height="900" fill="#090D16"/>

  <!-- Top Studio Header & Live Price Bar -->
