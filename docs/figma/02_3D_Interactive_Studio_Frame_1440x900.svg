      <rect x="916" y="80" width="500" height="196" rx="16" fill="#111827" stroke="#1E293B"/>
      <text x="940" y="112" fill="#38BDF8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="700">DUAL INTERFACE 01 · AI PROMPT</text>
      <text x="940" y="136" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="16" font-weight="800">AI 실시간 커스텀 프롬프트 창</text>
      <rect x="940" y="150" width="364" height="68" rx="10" fill="#090D16" stroke="#334155"/>
      <text x="956" y="178" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">후드티, 단단한 480g 소재, 큰 후드,</text>
      <text x="956" y="198" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">안감은 면이고 겉감은 원단 두 개 덧댐</text>
      <rect x="1314" y="150" width="78" height="68" rx="10" fill="#38BDF8"/>
      <text x="1353" y="189" text-anchor="middle" fill="#090D16" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" font-weight="800">AI 반영</text>
      <text x="940" y="246" fill="#34D399" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">✓ 프롬프트 스펙 자동 매핑 완료 · 상표권 위배 요소 없음</text>
    </g>

    <!-- Part B: Fine-Grained Garment Spec Controller -->
