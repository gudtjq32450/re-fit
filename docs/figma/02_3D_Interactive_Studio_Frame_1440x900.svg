      <text x="56" y="124" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="700">의류 뷰잉 · 부위 스냅:</text>
      <rect x="184" y="106" width="52" height="26" rx="6" fill="#38BDF8"/><text x="210" y="123" text-anchor="middle" fill="#090D16" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="800">정면</text>
      <rect x="242" y="106" width="52" height="26" rx="6" fill="#111827" stroke="#334155"/><text x="268" y="123" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">측면</text>
      <rect x="300" y="106" width="52" height="26" rx="6" fill="#111827" stroke="#334155"/><text x="326" y="123" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">후면</text>
      <rect x="358" y="106" width="74" height="26" rx="6" fill="#111827" stroke="#334155"/><text x="395" y="123" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">후드 확대</text>
      <rect x="438" y="106" width="84" height="26" rx="6" fill="#111827" stroke="#334155"/><text x="480" y="123" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">프린팅 확대</text>

