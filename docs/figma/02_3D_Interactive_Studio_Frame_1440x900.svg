    <rect width="1440" height="64" fill="#111827"/>
    <line x1="0" y1="64" x2="1440" y2="64" stroke="#1E293B"/>
    <text x="32" y="39" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" font-weight="800">RE:FIT</text>
    <rect x="112" y="18" width="290" height="28" rx="6" fill="#090D16" stroke="#334155"/>
    <text x="126" y="36" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="600">헤비웨이트 더블레이어 후드티 · 14.8k Tris · 60fps</text>

    <!-- Live RAG Cost Readout -->
    <text x="1030" y="28" text-anchor="end" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">RAG 실시간 예상 제작 단가 (100벌 공구 기준)</text>
    <text x="1030" y="47" text-anchor="end" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="14" font-weight="800">예상 제작가 70,000원 · 구매 예치금 85,000원</text>

    <rect x="1052" y="14" width="168" height="36" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="1136" y="36" text-anchor="middle" fill="#E2E8F0" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="700">5대 채광 비교 뷰</text>

    <rect x="1232" y="14" width="176" height="36" rx="8" fill="#38BDF8"/>
    <text x="1320" y="36" text-anchor="middle" fill="#090D16" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="800">공구 시안 등록하기 →</text>
  </g>

  <!-- ================================================================== -->
  <!-- LEFT/CENTER AREA: 3D INTERACTIVE ATELIER VIEWPORT (880px wide)     -->
  <!-- ================================================================== -->
