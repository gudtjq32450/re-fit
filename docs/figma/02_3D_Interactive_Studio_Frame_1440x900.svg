      <!-- Garment & Fabric Selectors -->
      <text x="940" y="380" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="600">의류 종류 (레거시 포함)</text>
      <rect x="940" y="390" width="218" height="38" rx="8" fill="#090D16" stroke="#334155"/>
      <text x="956" y="414" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="700">후드티 (오버핏 베이스) ▾</text>

      <text x="1174" y="380" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="600">겉감 원단 &amp; 물성</text>
      <rect x="1174" y="390" width="218" height="38" rx="8" fill="#090D16" stroke="#334155"/>
      <text x="1190" y="414" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="700">헤비 코튼 480g ▾</text>

      <!-- Material Physics Spec Readout -->
      <rect x="940" y="442" width="452" height="54" rx="10" fill="#090D16" stroke="#1E293B"/>
      <text x="958" y="464" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">강성(Stiffness): 0.72</text>
      <text x="1112" y="464" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">주름 잔류율: 45%</text>
      <text x="1262" y="464" fill="#38BDF8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="700">광학: Sheen 활성</text>
      <text x="958" y="484" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">✓ 빅 후드 모듈 ON   ·   ✓ 안감 순면 + 겉감 원단 이중 덧댐 ON</text>

      <!-- Color & Printing -->
      <text x="940" y="528" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="600">염색 컬러 배색</text>
      <circle cx="956" cy="554" r="13" fill="#262F3D" stroke="#F8FAFC" stroke-width="2"/>
      <circle cx="992" cy="554" r="13" fill="#D6D3CD"/>
      <circle cx="1028" cy="554" r="13" fill="#1E3A5F"/>
      <circle cx="1064" cy="554" r="13" fill="#3F4D3B"/>
      <circle cx="1100" cy="554" r="13" fill="#6B2D2C"/>

      <text x="1154" y="528" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="600">프린팅 / AI 로고 (OFL 폰트)</text>
      <rect x="1154" y="538" width="238" height="36" rx="8" fill="#090D16" stroke="#334155"/>
      <text x="1170" y="560" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">RE:FIT STUDIO (Pretendard)</text>

      <!-- XS ~ 3XL Real-time Sizing -->
      <text x="940" y="610" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="600">체형 치수 &amp; 사이즈 자동 변형 (XS ~ 3XL)</text>
      <text x="1392" y="610" text-anchor="end" fill="#38BDF8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="700">L · 어깨 58 / 가슴 63 / 기장 72cm</text>

      <rect x="940" y="624" width="58" height="34" rx="6" fill="#090D16" stroke="#334155"/><text x="969" y="646" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">XS</text>
      <rect x="1005" y="624" width="58" height="34" rx="6" fill="#090D16" stroke="#334155"/><text x="1034" y="646" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">S</text>
      <rect x="1070" y="624" width="58" height="34" rx="6" fill="#090D16" stroke="#334155"/><text x="1099" y="646" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">M</text>
      <rect x="1135" y="624" width="58" height="34" rx="6" fill="#38BDF8"/><text x="1164" y="646" text-anchor="middle" fill="#090D16" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="800">L</text>
      <rect x="1200" y="624" width="58" height="34" rx="6" fill="#090D16" stroke="#334155"/><text x="1229" y="646" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">XL</text>
      <rect x="1265" y="624" width="58" height="34" rx="6" fill="#090D16" stroke="#334155"/><text x="1294" y="646" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">2XL</text>
      <rect x="1330" y="624" width="62" height="34" rx="6" fill="#090D16" stroke="#334155"/><text x="1361" y="646" text-anchor="middle" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">3XL</text>

      <!-- Bottom Cost Summary Box -->
      <rect x="940" y="682" width="452" height="170" rx="12" fill="#090D16" stroke="#1E293B"/>
      <text x="960" y="710" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="700">RAG 실시간 단가 산출 근거</text>
      <text x="960" y="736" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">• 겉감(헤비코튼 480g) 32,000원 + 이중덧댐/안감 14,000원</text>
      <text x="960" y="758" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">• 봉제/빅후드 공임 18,000원 + 전면 프린팅 6,000원</text>
      <line x1="960" y1="776" x2="1372" y2="776" stroke="#1E293B"/>
      <text x="960" y="806" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="15" font-weight="800">예상 제작가 70,000원</text>
      <text x="1372" y="806" text-anchor="end" fill="#38BDF8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="14" font-weight="800">공구 예치금 85,000원</text>
      <text x="960" y="832" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">※ 등록 후 1주일 이내 참여자 수수료 감면 · 낙찰 단가 차액 자동 환급</text>
