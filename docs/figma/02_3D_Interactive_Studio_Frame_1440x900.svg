      <text x="572" y="123" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="600">옷 자체 360° 회전</text>
      <line x1="674" y1="119" x2="764" y2="119" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <circle cx="719" cy="119" r="7" fill="#38BDF8"/>
      <rect x="780" y="106" width="90" height="26" rx="6" fill="#1E293B"/><text x="825" y="123" text-anchor="middle" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="700">턴테이블 ON</text>
