      <g id="Garment_3D_Mesh_Hoodie">
        <!-- Big Hood -->
        <path d="M462 246 C462 192, 618 192, 618 246 L604 282 L476 282 Z" fill="#1E2530" stroke="#334155" stroke-width="1.5"/>
        <!-- Left Sleeve -->
        <path d="M432 278 L348 446 L396 466 L454 344 Z" fill="#222A36" stroke="#334155"/>
        <!-- Right Sleeve -->
        <path d="M648 278 L732 446 L684 466 L626 344 Z" fill="#2B3544" stroke="#334155"/>
        <!-- Torso Outer Double Layer -->
        <path d="M432 278 Q540 264 648 278 L658 618 Q540 632 422 618 Z" fill="#262F3D" stroke="#475569" stroke-width="1.5"/>
        <!-- Inner Cotton Layer Hem Peek -->
        <rect x="426" y="620" width="228" height="8" rx="3" fill="#E2E8F0"/>
        <!-- Kangaroo Pocket -->
        <path d="M474 478 L606 478 L622 574 L458 574 Z" fill="#1F2733" stroke="#334155"/>
        <!-- Chest Decal Typography -->
        <text x="540" y="392" text-anchor="middle" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="800" letter-spacing="2">RE:FIT STUDIO</text>

        <!-- Active Crumple Brush Indicator on Right Sleeve! -->
        <circle cx="678" cy="396" r="42" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5 4"/>
        <path d="M656 384 Q678 392 698 378" stroke="#090D16" stroke-width="2.2"/>
        <path d="M652 398 Q678 408 702 394" stroke="#94A3B8" stroke-width="1.6"/>
        <path d="M658 412 Q680 420 696 408" stroke="#090D16" stroke-width="2"/>
      </g>

      <!-- Viewport Status Overlay -->
