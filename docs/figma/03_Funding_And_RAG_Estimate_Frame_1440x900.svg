    <text x="68" y="132" fill="#38BDF8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="700">FUND IT · CROWDFUNDING GROUP-BUY</text>
    <text x="68" y="162" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="800">헤비웨이트 480g 더블레이어 빅후드</text>
    <text x="68" y="188" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13">제작자 @seopyoon · 팔로우 +   |   ♥ 좋아요 248   |   디자인 이용권 5,000원</text>

    <!-- Progress Box -->
    <rect x="68" y="214" width="606" height="148" rx="12" fill="#090D16" stroke="#1E293B"/>
    <text x="92" y="248" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="15" font-weight="800">구매 예정 확정자 114명 / 최소 목표 100명 (114% 달성!)</text>
    <rect x="92" y="268" width="558" height="14" rx="7" fill="#1E293B"/>
    <rect x="92" y="268" width="558" height="14" rx="7" fill="#38BDF8"/>
    <text x="92" y="312" fill="#34D399" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="700">✓ 최소 인원 100명 돌파 — 현재 공급업체 역경매 입찰 진행 중</text>
    <text x="92" y="336" fill="#FACC15" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">★ 얼리버드 혜택: 등록 후 1주일 이내 참여자 플랫폼 수수료 감면 적용</text>

    <!-- Pricing Comparison -->
    <g id="Pricing_Escrow_Boxes">
      <rect x="68" y="384" width="294" height="118" rx="12" fill="#090D16" stroke="#334155"/>
      <text x="92" y="416" fill="#94A3B8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12">AI 산출 예상 제작 단가</text>
      <text x="92" y="454" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" font-weight="800">70,000원</text>
      <text x="92" y="482" fill="#64748B" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">원단·이중덧댐·공임 RAG 기준</text>

      <rect x="380" y="384" width="294" height="118" rx="12" fill="#090D16" stroke="#38BDF8"/>
      <text x="404" y="416" fill="#38BDF8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="700">구매 예정 확정 선충전 예치금</text>
      <text x="404" y="454" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" font-weight="800">85,000원</text>
      <text x="404" y="482" fill="#CBD5E1" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11">최종 낙찰 단가 확정 후 차액 즉시 환급</text>
    </g>

