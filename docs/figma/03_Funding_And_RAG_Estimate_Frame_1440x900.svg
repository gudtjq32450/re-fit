<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="Frame_03_Funding_And_Bidding" width="1440" height="900" fill="#090D16"/>

  <!-- Header -->
  <g id="TopNavBar">
    <rect width="1440" height="64" fill="#111827"/>
    <line x1="0" y1="64" x2="1440" y2="64" stroke="#1E293B"/>
    <text x="36" y="39" fill="#F8FAFC" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" font-weight="800">RE:FIT</text>
    <text x="118" y="38" fill="#38BDF8" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="700">Fund it · Wear it — 공동구매 예치 &amp; 공급업체 입찰·제작 투명 공개</text>
  </g>

  <!-- Left Card: Campaign Status & Escrow Participation -->
  <g id="Campaign_Escrow_Card">
